<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile Card</title>
<style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .profile-card {
        background: #fff;
        width: 320px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .profile-card:hover {
        transform: translateY(-5px);
    }

    .profile-header {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        padding: 20px;
        text-align: center;
        color: white;
    }

    .profile-header img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 3px solid white;
        object-fit: cover;
    }

    .profile-header h2 {
        margin: 10px 0 5px;
    }

    .profile-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
    }

    .profile-details {
        padding: 20px;
        display: none; 
    }

    .profile-details p {
        margin: 8px 0;
        font-size: 14px;
        color: #333;
    }

    .toggle-btn {
        display: block;
        width: 100%;
        padding: 12px;
        background: #2575fc;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s ease;
    }

    .toggle-btn:hover {
        background: #1a5edb;
    }

    @media (max-width: 400px) {
        .profile-card {
            width: 90%;
        }
    }
</style>
</head>
<body>

<div class="profile-card">

    <div class="profile-header">
        <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="User Photo">
        <h2>John Doe</h2>
        <p>Web Developer</p>
    </div>

    <div class="profile-details">
        <p><strong>Email:</strong> john.doe@example.com</p>
        <p><strong>Phone:</strong> +1 234 567 890</p>
        <p><strong>Location:</strong> New York, USA</p>
        <p><strong>About:</strong> Passionate about creating interactive web applications and learning new technologies.</p>
    </div>

    <button class="toggle-btn">Show Details</button>

</div>





<script>

    const toggleBtn = document.querySelector('.toggle-btn');
    const details = document.querySelector('.profile-details');


    toggleBtn.addEventListener('click', () => {
        if (details.style.display === 'block') {
            details.style.display = 'none';
            toggleBtn.textContent = 'Show Details';
        } else {
            details.style.display = 'block';
            toggleBtn.textContent = 'Hide Details';
        }
    });
</script>

</body>
</html>
